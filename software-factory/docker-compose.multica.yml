# Local integration stack: Multica web/API/PostgreSQL plus the Sandbox factory.
# The factory talks to an existing Kubernetes cluster through KUBECONFIG_HOST_PATH;
# the cluster must contain the Agent Sandbox CRD/controller and three eligible
# worker nodes for the three-task behavior check.
name: multica-factory

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-factory-local-development-secret-change-me}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      MULTICA_APP_URL: http://localhost:${FRONTEND_PORT:-3000}
      APP_ENV: ${APP_ENV:-development}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-888888}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      HOSTNAME: 0.0.0.0
      REMOTE_API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}

  factory:
    # Linux host networking lets the factory reach the local kind API server
    # and the host-published Multica backend without rewriting kubeconfig.
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - factory_data:/app/data
      - ${KUBECONFIG_HOST_PATH:?Set KUBECONFIG_HOST_PATH to a kubeconfig reachable from the factory container}:/root/.kube/config:ro
    environment:
      FACTORY_ADDR: :8081
      FACTORY_DB: /app/data/factory.db
      FACTORY_NAMESPACE: ${FACTORY_NAMESPACE:-factory-test}
      FACTORY_IMAGE: ${FACTORY_IMAGE:-ghcr.io/tmih06/ompig-slim-workspace:v0.1.5}
      FACTORY_CAPACITY: ${FACTORY_CAPACITY:-3}
      MULTICA_SERVER_URL: http://127.0.0.1:8080
      MULTICA_TOKEN: ${MULTICA_TOKEN:-}
      MULTICA_WORKSPACE_ID: ${MULTICA_WORKSPACE_ID:-}
      MULTICA_PROVIDER: ${MULTICA_PROVIDER:-omp}
      MULTICA_AGENT_NAME: ${MULTICA_AGENT_NAME:-Sandbox Builder}
      MULTICA_AGENT_MODEL: ${MULTICA_AGENT_MODEL-deploy/deepseek-ai/deepseek-v4.1-flash-1017}
      MULTICA_AGENT_THINKING: ${MULTICA_AGENT_THINKING:-medium}
      MULTICA_AGENT_INSTRUCTIONS: ${MULTICA_AGENT_INSTRUCTIONS:-Work on the assigned issue. Make the requested changes, run relevant tests, and report the result.}
      MULTICA_DAEMON_ID: ${MULTICA_DAEMON_ID:-factory-sandbox}
      MULTICA_REPOSITORY: ${MULTICA_REPOSITORY:-}
      FACTORY_BROKER_URL: ${FACTORY_BROKER_URL:-}
      FACTORY_BROKER_TOKEN_SECRET: ${FACTORY_BROKER_TOKEN_SECRET:-}
      KUBECONFIG: /root/.kube/config

volumes:
  pgdata:
  backend_uploads:
  factory_data:
